version = 1

[approve]
auto_approve_usernames = ["dependabot"]

[merge]
# merge a PR that's already up to date and passing all checks, rather than waiting its turn in the queue
prioritize_ready_to_merge = true

[merge.message]
include_coauthors = true
include_pull_request_url = true

[merge.automerge_dependencies]
# auto merge all PRs opened by "dependabot" that are "minor" or "patch" version upgrades. "major" version upgrades will be ignored.
versions = ["minor", "patch"]
usernames = ["dependabot"]