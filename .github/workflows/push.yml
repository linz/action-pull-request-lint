name: test

on: push

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: linz/action-setup-node@48f43de2a9a49534e8d739cd34b75b797ad032ce # v1.0.8

      - name: Test
        run: node --test
